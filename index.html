<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elayon Core</title>
  <style>
    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      font-family:system-ui,-apple-system,sans-serif;
      background: radial-gradient(circle at top left, #eaf7e3, #dff4f6);
      color:#0a2a2f;
    }
    .box{ text-align:center; }
    img{ width:72px; height:72px; border-radius:12px; border:1px solid #cfe4e7; background:#fff; }
    h1{ margin:12px 0 6px; font-size:22px; }
    p{ margin:0; opacity:.75; font-size:14px; }
  </style>
  <script>
    setTimeout(() => window.location.replace('./cadastro.html'), 900);
  </script>
</head>
<body>
  <div class="box">
    <img
      src="./elayon_logo.png?v=3"
      alt="Logo Elayon"
      onerror="this.onerror=null;this.src='https://elayon.space/wp-content/uploads/2026/04/elayon_logo.png';"
    />
    <h1>Elayon Core</h1>
    <p>Redirecionando para o cadastro...</p>
  </div>
</body>
</html>
