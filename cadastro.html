<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cadastro | Elayon Core</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg1:#dff4f6; --bg2:#eaf7e3; --card:#ffffff; --ink:#0a2a2f;
      --muted:#4a6b70; --line:#cfe4e7; --accent:#66c7c0; --accent2:#7bd490;
      --shadow:0 10px 30px rgba(0,0,0,.08);
    }
    body{
      font-family:system-ui,-apple-system,sans-serif;
      background: radial-gradient(circle at top left, var(--bg2), var(--bg1));
      min-height:100vh; color:var(--ink);
      padding-top:72px; display:flex; flex-direction:column; align-items:center;
    }

    .site-nav{
      width:100%; background:rgba(255,255,255,.88);
      backdrop-filter: blur(10px); border-bottom:1px solid var(--line);
      padding:12px 0; position:fixed; top:0; left:0; z-index:9999;
    }
    .nav-container{
      max-width:700px; margin:0 auto; padding:0 12px;
      display:flex; justify-content:center; gap:8px; flex-wrap:wrap;
    }
    .nav-link{
      text-decoration:none; color:var(--muted); font-size:11px; font-weight:700;
      padding:6px 10px; border-radius:8px; text-transform:uppercase; transition:.2s;
      border:1px solid transparent;
    }
    .nav-link:hover{ background:var(--accent); color:white; }
    .nav-link.site{ border-color:var(--line); }

    .wrap{ width:100%; max-width:520px; padding:20px; }
    .logo-area{ display:flex; align-items:center; gap:12px; margin-bottom:20px; }
    .logo-box{
      width:48px; height:48px; border-radius:12px; background:#fff; border:1px solid var(--line);
      overflow:hidden; flex-shrink:0;
    }
    .logo-box img{ width:100%; height:100%; object-fit:cover; display:block; }

    .card{
      background:white; padding:28px; border-radius:24px; border:1px solid var(--line);
      box-shadow:var(--shadow);
    }
    h2{ font-size:26px; margin-bottom:8px; letter-spacing:-1px; }
    .muted-text{ color:var(--muted); font-size:14px; margin-bottom:20px; line-height:1.4; }

    .form-field{ margin-bottom:14px; }
    label{ display:block; margin-bottom:6px; font-weight:700; font-size:13px; }
    input{
      width:100%; padding:14px 16px; border-radius:12px; border:2px solid var(--line);
      font-size:16px; background:#fdfdfd; transition:.2s;
    }
    input:focus{ border-color:var(--accent); outline:none; background:#fff; }

    .choice-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0 16px; }
    .choice-btn{
      border:1px solid var(--line); background:#f7fbfb; border-radius:12px;
      padding:10px; text-align:left; cursor:pointer; font-weight:700; color:var(--ink);
    }
    .choice-btn small{ display:block; margin-top:4px; color:var(--muted); font-size:11px; font-weight:600; }
    .choice-btn.active{
      border-color:var(--accent);
      background:linear-gradient(135deg,#ecfbf8,#eefcf2);
      box-shadow:0 0 0 3px rgba(102,199,192,.12);
    }

    .btns-grid{ display:flex; flex-direction:column; gap:10px; margin-top:18px; }
    .btn-box{
      width:100%; padding:15px; border-radius:12px; border:none;
      font-size:15px; font-weight:800; cursor:pointer; text-align:center; text-decoration:none; transition:.2s;
    }
    .primary{ background:linear-gradient(135deg,var(--accent),var(--accent2)); color:var(--ink); }
    .secondary{ background:#f0f7f7; color:var(--ink); border:1px solid var(--line); }
    .btn-box:hover{ transform:translateY(-2px); filter:brightness(1.03); }

    .foot{ text-align:center; margin:18px 0; color:var(--muted); font-size:11px; }
    .hide{ display:none !important; }

    .dev-box{ margin-top:14px; border:1px dashed var(--line); border-radius:12px; padding:10px; background:#fbfefe; }
    .dev-title{ font-size:12px; font-weight:700; color:var(--muted); margin-bottom:8px; }
    #logTech{
      margin-top:8px; background:#000; color:#0f0; padding:10px; border-radius:10px;
      max-height:180px; overflow:auto; font-size:11px;
    }
  </style>
</head>
<body data-page="cadastro">

  <nav class="site-nav">
    <div class="nav-container">
      <a href="https://elayon.space/projeto" class="nav-link site" target="_blank" rel="noopener">Projeto</a>
      <a href="https://elayon.space/termos" class="nav-link site" target="_blank" rel="noopener">Termos</a>
      <a href="https://elayon.space/privacidade-dados" class="nav-link site" target="_blank" rel="noopener">Privacidade</a>
      <a href="https://elayon.space/contato" class="nav-link site" target="_blank" rel="noopener">Contato</a>
      <a href="https://elayon.space" class="nav-link site" target="_blank" rel="noopener">Voltar ao Site</a>
    </div>
  </nav>

  <div class="wrap">
    <header class="logo-area">
      <div class="logo-box">
        <img
          src="./elayon_logo.png?v=3"
          alt="Logo Elayon"
          onerror="this.onerror=null;this.src='https://elayon.space/wp-content/uploads/2026/04/elayon_logo.png';"
        />
      </div>
      <div>
        <h1 style="font-size:18px;">Elayon Core</h1>
        <p style="font-size:12px; color:var(--muted);">Conexão Segura</p>
      </div>
    </header>

    <main class="card">
      <h2>Novo Registro</h2>
      <p class="muted-text">Ative sua conexão com presença e clareza. Dados protegidos com sigilo técnico.</p>

      <form id="signupForm">
        <div class="choice-grid">
          <button type="button" class="choice-btn active" data-type="usuario">
            Usuário
            <small>Uso pessoal</small>
          </button>
          <button type="button" class="choice-btn" data-type="piloto">
            Piloto
            <small>Pessoal + conexão com sistemas</small>
          </button>
          <button type="button" class="choice-btn" data-type="profissional">
            Profissional
            <small>Ferramenta profissional</small>
          </button>
          <button type="button" class="choice-btn" data-type="empresa">
            Empresa
            <small>Integração institucional</small>
          </button>
        </div>
        <input type="hidden" id="signupRole" value="usuario" />

        <div class="form-field">
          <label for="signupName">Nome Completo</label>
          <input type="text" id="signupName" required placeholder="Ex: Paulo Roberto">
        </div>

        <div class="form-field">
          <label for="signupEmail">E-mail Operacional</label>
          <input type="email" id="signupEmail" required placeholder="seu@email.com">
        </div>

        <div class="form-field">
          <label for="signupPassword">Chave de Acesso</label>
          <input type="password" id="signupPassword" required minlength="6" placeholder="••••••••">
        </div>

        <div class="btns-grid">
          <button type="submit" class="btn-box primary" id="btnCreate">Ativar Conexão</button>
          <button type="button" class="btn-box secondary" onclick="window.location.href='login.html'">Já tenho conta</button>
        </div>

        <div id="signupMessage" class="hide"></div>
      </form>

      <div class="dev-box">
        <p class="dev-title">Diagnóstico técnico</p>
        <button id="btnTestarTunnel" class="btn-box secondary" type="button">Rodar Diagnóstico</button>
        <button id="btnResetLog" class="btn-box secondary" type="button" style="margin-top:8px;">Limpar Log</button>
        <pre id="logTech"></pre>
      </div>
    </main>

    <footer class="foot">
      Elayon Core • Sigilo e responsabilidade técnica
    </footer>
  </div>

  <script>
    (function(){
      const roleInput = document.getElementById('signupRole');
      const buttons = document.querySelectorAll('.choice-btn');
      const btnCreate = document.getElementById('btnCreate');

      function updateLabel(role){
        if (role === 'profissional') btnCreate.textContent = 'Ativar Conta Profissional';
        else if (role === 'empresa') btnCreate.textContent = 'Ativar Conta Institucional';
        else if (role === 'piloto') btnCreate.textContent = 'Ativar Conexão do Piloto';
        else btnCreate.textContent = 'Ativar Conexão';
      }

      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          buttons.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          roleInput.value = btn.dataset.type;
          updateLabel(btn.dataset.type);
        });
      });
    })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/tunnel.js"></script>
  <script src="js/teste-runner.js"></script>
</body>
</html>
